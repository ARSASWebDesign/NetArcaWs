name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'ARSASWebDesign/NetArcaWs'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit from main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Record source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet restore NetArcaWs.slnx --locked-mode
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: dotnet run --project tools/NetArcaWs.Build --configuration Release --no-restore -- release-version
      - run: dotnet build NetArcaWs.slnx --configuration Release --no-restore
      - run: dotnet test --solution NetArcaWs.slnx --configuration Release --no-build --no-restore
      - run: dotnet run --project tools/NetArcaWs.Build --configuration Release --no-build --no-restore -- persistence-schema --check
      - run: dotnet run --project tools/NetArcaWs.Build --configuration Release --no-build --no-restore -- persistence-migrations --check
      - name: Pack all release projects
        run: |
          set -euo pipefail
          projects=(NetArcaWs NetArcaWs.Tool NetArcaWs.EntityFrameworkCore NetArcaWs.EntityFrameworkCore.MySql NetArcaWs.EntityFrameworkCore.PostgreSql NetArcaWs.EntityFrameworkCore.SqlServer NetArcaWs.EntityFrameworkCore.Migrations.Sqlite NetArcaWs.EntityFrameworkCore.Migrations.MySql NetArcaWs.EntityFrameworkCore.Migrations.MariaDb NetArcaWs.EntityFrameworkCore.Migrations.PostgreSql NetArcaWs.EntityFrameworkCore.Migrations.SqlServer)
          for project in "${projects[@]}"; do
            dotnet pack "src/$project/$project.csproj" --configuration Release --no-build --no-restore --output artifacts
          done
      - name: Validate packages, install tool and smoke-test persistence packages
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          NUGET_PACKAGES: ${{ runner.temp }}/netarcaws-nuget-packages
        run: |
          set -euo pipefail
          projects=(NetArcaWs NetArcaWs.Tool NetArcaWs.EntityFrameworkCore NetArcaWs.EntityFrameworkCore.MySql NetArcaWs.EntityFrameworkCore.PostgreSql NetArcaWs.EntityFrameworkCore.SqlServer NetArcaWs.EntityFrameworkCore.Migrations.Sqlite NetArcaWs.EntityFrameworkCore.Migrations.MySql NetArcaWs.EntityFrameworkCore.Migrations.MariaDb NetArcaWs.EntityFrameworkCore.Migrations.PostgreSql NetArcaWs.EntityFrameworkCore.Migrations.SqlServer)
          expected=()
          for project in "${projects[@]}"; do
            filename="$project.$PACKAGE_VERSION.nupkg"
            test -f "artifacts/$filename"
            expected+=("$filename")
          done
          actual=(artifacts/*.nupkg)
          test "${#actual[@]}" -eq "${#expected[@]}"
          test -f "artifacts/NetArcaWs.$PACKAGE_VERSION.nupkg"
          test -f "artifacts/NetArcaWs.Tool.$PACKAGE_VERSION.nupkg"
          dotnet tool install NetArcaWs.Tool --tool-path artifacts/tool-smoke --source artifacts --version "$PACKAGE_VERSION"
          artifacts/tool-smoke/netarcaws --help
          test "$(artifacts/tool-smoke/netarcaws --version)" = "netarcaws $PACKAGE_VERSION"
          dotnet restore tests/NetArcaWs.Persistence.PackageSmoke/NetArcaWs.Persistence.PackageSmoke.csproj --configfile tests/NetArcaWs.Persistence.PackageSmoke/NuGet.config -p:PersistencePackageVersion="$PACKAGE_VERSION"
          dotnet run --project tests/NetArcaWs.Persistence.PackageSmoke/NetArcaWs.Persistence.PackageSmoke.csproj --configuration Release --no-restore -p:PersistencePackageVersion="$PACKAGE_VERSION"
          git rev-parse HEAD > artifacts/BUILD_COMMIT
          cd artifacts
          sha256sum -- "${expected[@]}" > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-${{ steps.version.outputs.version }}
          path: |
            artifacts/*.nupkg
            artifacts/SHA256SUMS
            artifacts/BUILD_COMMIT
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'release' && github.repository == 'ARSASWebDesign/NetArcaWs'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Validate release identity
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          BUILD_VERSION: ${{ needs.build.outputs.version }}
          BUILD_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9a-z-]+(\.[0-9a-z-]+)*)?$'
          commit='^[0-9a-f]{40}$'
          [[ "$BUILD_VERSION" =~ $semver ]] || { echo "Invalid package version from build job" >&2; exit 1; }
          [[ "$RELEASE_TAG" == "v$BUILD_VERSION" ]] || { echo "Release tag and package version do not match" >&2; exit 1; }
          [[ "$BUILD_COMMIT" =~ $commit ]] || { echo "Invalid source commit from build job" >&2; exit 1; }
          if [[ "$RELEASE_PRERELEASE" == true ]]; then
            [[ "$BUILD_VERSION" == *-* ]] || { echo "Prerelease flag does not match package version" >&2; exit 1; }
          else
            [[ "$BUILD_VERSION" != *-* ]] || { echo "Prerelease version is not marked as a prerelease" >&2; exit 1; }
          fi
          printf 'version=%s\ncommit=%s\n' "$BUILD_VERSION" "$BUILD_COMMIT" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-${{ steps.release.outputs.version }}
          path: artifacts
      - name: Verify build artifacts
        working-directory: artifacts
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
          BUILD_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          packages=(NetArcaWs NetArcaWs.Tool NetArcaWs.EntityFrameworkCore NetArcaWs.EntityFrameworkCore.MySql NetArcaWs.EntityFrameworkCore.PostgreSql NetArcaWs.EntityFrameworkCore.SqlServer NetArcaWs.EntityFrameworkCore.Migrations.Sqlite NetArcaWs.EntityFrameworkCore.Migrations.MySql NetArcaWs.EntityFrameworkCore.Migrations.MariaDb NetArcaWs.EntityFrameworkCore.Migrations.PostgreSql NetArcaWs.EntityFrameworkCore.Migrations.SqlServer)
          expected=()
          for package in "${packages[@]}"; do
            filename="$package.$PACKAGE_VERSION.nupkg"
            test -f "$filename"
            expected+=("$filename")
          done
          actual=( *.nupkg )
          test "${#actual[@]}" -eq "${#expected[@]}"
          test "$(cat BUILD_COMMIT)" = "$BUILD_COMMIT"
          awk -v expected="${expected[*]}" 'BEGIN { count=split(expected, names, " "); for (i=1;i<=count;i++) wanted[names[i]]=1 } NF == 2 && $1 ~ /^[0-9a-f]{64}$/ { sub(/^\.\//, "", $2); if (wanted[$2] && !seen[$2]) { seen[$2]=1; valid++ } else exit 1; next } { exit 1 } END { exit !(NR == count && valid == count) }' SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Attach missing release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          packages=(NetArcaWs NetArcaWs.Tool NetArcaWs.EntityFrameworkCore NetArcaWs.EntityFrameworkCore.MySql NetArcaWs.EntityFrameworkCore.PostgreSql NetArcaWs.EntityFrameworkCore.SqlServer NetArcaWs.EntityFrameworkCore.Migrations.Sqlite NetArcaWs.EntityFrameworkCore.Migrations.MySql NetArcaWs.EntityFrameworkCore.Migrations.MariaDb NetArcaWs.EntityFrameworkCore.Migrations.PostgreSql NetArcaWs.EntityFrameworkCore.Migrations.SqlServer)
          expected=()
          for package in "${packages[@]}"; do expected+=("$package.$PACKAGE_VERSION.nupkg"); done
          expected+=(SHA256SUMS BUILD_COMMIT)
          assets="$(gh release view "$RELEASE_TAG" --repo ARSASWebDesign/NetArcaWs --json assets --jq '.assets[].name')"
          missing=()
          for asset in "${expected[@]}"; do
            if printf '%s\n' "$assets" | grep -Fxq -- "$asset"; then
              temporary="$(mktemp -d)"
              gh release download "$RELEASE_TAG" --repo ARSASWebDesign/NetArcaWs --pattern "$asset" --dir "$temporary"
              local_hash="$(sha256sum "artifacts/$asset" | cut -d ' ' -f 1)"
              remote_hash="$(sha256sum "$temporary/$asset" | cut -d ' ' -f 1)"
              rm -rf "$temporary"
              if [[ "$local_hash" != "$remote_hash" ]]; then
                echo "Existing release asset differs: $asset. Do not replace published artifacts; create a new version." >&2
                exit 1
              fi
            else
              missing+=("artifacts/$asset")
            fi
          done
          if ((${#missing[@]})); then
            gh release upload "$RELEASE_TAG" --repo ARSASWebDesign/NetArcaWs "${missing[@]}"
          fi
      - name: Verify existing NuGet packages before login
        id: nuget-preflight
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          packages=(NetArcaWs NetArcaWs.Tool NetArcaWs.EntityFrameworkCore NetArcaWs.EntityFrameworkCore.MySql NetArcaWs.EntityFrameworkCore.PostgreSql NetArcaWs.EntityFrameworkCore.SqlServer NetArcaWs.EntityFrameworkCore.Migrations.Sqlite NetArcaWs.EntityFrameworkCore.Migrations.MySql NetArcaWs.EntityFrameworkCore.Migrations.MariaDb NetArcaWs.EntityFrameworkCore.Migrations.PostgreSql NetArcaWs.EntityFrameworkCore.Migrations.SqlServer)
          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          verified_existing=()
          for package in "${packages[@]}"; do
            id="$(printf '%s' "$package" | tr '[:upper:]' '[:lower:]')"
            version="$(printf '%s' "$PACKAGE_VERSION" | tr '[:upper:]' '[:lower:]')"
            url="https://api.nuget.org/v3-flatcontainer/$id/$version/$id.$version.nupkg"
            status="$(curl --location --silent --show-error --output "$temporary/remote.nupkg" --write-out '%{http_code}' "$url")"
            if [[ "$status" == 404 ]]; then
              continue
            fi
            if [[ "$status" != 200 ]]; then
              echo "NuGet preflight failed for $package $PACKAGE_VERSION: HTTP $status" >&2
              exit 1
            fi

            local_package="artifacts/$package.$PACKAGE_VERSION.nupkg"
            zipinfo -1 "$local_package" | LC_ALL=C sort > "$temporary/local-all.entries"
            zipinfo -1 "$temporary/remote.nupkg" | LC_ALL=C sort > "$temporary/remote-all.entries"
            if [[ -n "$(uniq -d "$temporary/local-all.entries")" || -n "$(uniq -d "$temporary/remote-all.entries")" ]]; then
              echo "NuGet package $package contains duplicate ZIP entries; refusing to skip publication." >&2
              exit 1
            fi
            sed '\|^\.signature\.p7s$|d' "$temporary/local-all.entries" > "$temporary/local.entries"
            sed '\|^\.signature\.p7s$|d' "$temporary/remote-all.entries" > "$temporary/remote.entries"
            if ! diff -u "$temporary/local.entries" "$temporary/remote.entries"; then
              echo "Existing NuGet package $package $PACKAGE_VERSION has different archive entries; refusing to skip publication." >&2
              exit 1
            fi
            while IFS= read -r entry; do
              [[ -n "$entry" ]] || continue
              escaped_entry="${entry//\[/[[]}"
              escaped_entry="${escaped_entry//\*/[*]}"
              escaped_entry="${escaped_entry//\?/[?]}"
              local_hash="$(unzip -p "$local_package" "$escaped_entry" | sha256sum | cut -d ' ' -f 1)"
              remote_hash="$(unzip -p "$temporary/remote.nupkg" "$escaped_entry" | sha256sum | cut -d ' ' -f 1)"
              if [[ "$local_hash" != "$remote_hash" ]]; then
                echo "Existing NuGet package $package $PACKAGE_VERSION differs at $entry; refusing to skip publication." >&2
                exit 1
              fi
            done < "$temporary/local.entries"
            verified_existing+=("$package")
          done
          verified_csv=""
          if ((${#verified_existing[@]})); then
            verified_csv="$(IFS=,; printf '%s' "${verified_existing[*]}")"
          fi
          printf 'verified_existing=%s\n' "$verified_csv" >> "$GITHUB_OUTPUT"
      - name: Require NuGet account setup
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Configure NUGET_USER and the NuGet trusted publishing policy described in docs/releases.md."
            exit 1
          fi
      - name: NuGet trusted publishing login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish all packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
          VERIFIED_EXISTING: ${{ steps.nuget-preflight.outputs.verified_existing }}
        run: |
          set -euo pipefail
          packages=(NetArcaWs NetArcaWs.Tool NetArcaWs.EntityFrameworkCore NetArcaWs.EntityFrameworkCore.MySql NetArcaWs.EntityFrameworkCore.PostgreSql NetArcaWs.EntityFrameworkCore.SqlServer NetArcaWs.EntityFrameworkCore.Migrations.Sqlite NetArcaWs.EntityFrameworkCore.Migrations.MySql NetArcaWs.EntityFrameworkCore.Migrations.MariaDb NetArcaWs.EntityFrameworkCore.Migrations.PostgreSql NetArcaWs.EntityFrameworkCore.Migrations.SqlServer)
          for package in "${packages[@]}"; do
            if [[ ",${VERIFIED_EXISTING:-}," == *",$package,"* ]]; then
              echo "Skipping previously verified identical package $package $PACKAGE_VERSION."
            else
              dotnet nuget push "artifacts/$package.$PACKAGE_VERSION.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
            fi
          done
